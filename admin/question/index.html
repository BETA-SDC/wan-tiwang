<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Question Preview - Wan Ti Wang</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body data-page="question" data-title="Question Preview" data-subtitle="Review one question before editing or adding it to a deck." data-back="/questions/" data-back-label="Back to Library">
    <div id="pageActions">
      <label class="inlineControl">Language
        <select id="questionLocale">
          <option value="zh-CN">zh-CN</option>
          <option value="en-US">en-US</option>
          <option value="bilingual">Bilingual 双语</option>
        </select>
      </label>
      <label class="inlineControl">Reveal
        <select id="questionRevealMode">
          <option value="hidden">Hidden until show</option>
          <option value="inline">Inline</option>
        </select>
      </label>
      <button id="toggleRevealButton" type="button">Show Reveal</button>
    </div>
    <section id="pageContent" class="pageContent singlePreview">
      <div class="previewContext">
        <p id="questionMeta">Loading question...</p>
        <div class="actions">
          <a id="editQuestionLink" class="buttonLink" href="/editor/">Edit Question</a>
          <a class="buttonLink" href="/slides/">Open Slides</a>
        </div>
      </div>
      <div class="slideStage">
        <div id="questionPreviewDeck" class="slideDeck"></div>
      </div>
    </section>
    <script type="module" src="/question/app.js"></script>
  </body>
</html>
